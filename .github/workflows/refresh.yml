name: refresh-data
on:
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run crawl -- --all
      - run: npm run basemap
      # Fails the job if coverage drops below 85% or airport/route counts
      # drift more than 5% from the last committed bundle. Intentionally not
      # passed --force-bundle: a tripped drift gate should fail loudly so a
      # human looks, not silently overwrite the dataset.
      - run: npm run bundle
      - run: npm test
      - name: Commit refreshed bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/airports.json public/routes.bin
          git diff --staged --quiet || git commit -m "chore: monthly route data refresh"
          git push
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
